name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: Check Python Syntax
        run: python3 -m compileall pc-api-python

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npm exec --workspace frontend -- playwright install --with-deps chromium

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Unit tests and type checks
        run: npm test
        
      - name: Debug dist output
        run: |
          find frontend/dist -maxdepth 4 -type f | sort | sed -n '1,220p' || true
          ls -la frontend/dist || true
          ls -la frontend/dist/about 2>/dev/null || true
          ls -la frontend/dist/licenses 2>/dev/null || true

      - name: Check SSG generated files
        run: |
          for file in \
            frontend/dist/about/index.html \
            frontend/dist/about.html \
            frontend/dist/licenses/index.html \
            frontend/dist/licenses.html \
            frontend/dist/sitemap.xml \
            frontend/dist/robots.txt
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing expected build output: $file"
              find frontend/dist -maxdepth 4 -type f | sort
              exit 1
            fi
          done
      - name: Check AGPL and GitHub references in licenses
        run: |
          for pair in \
            "frontend/dist/licenses/index.html::AGPL-3.0" \
            "frontend/dist/licenses/index.html::pdf2zh-next" \
            "frontend/dist/licenses/index.html::github.com/oligamiq/pdf2zh-web-translator" \
            "frontend/dist/licenses/index.html::ライセンス" \
            "frontend/dist/licenses.html::pdf2zh-next" \
            "frontend/dist/licenses.html::github.com/oligamiq/pdf2zh-web-translator"
          do
            file="${pair%%::*}"
            text="${pair#*::}"
            if ! grep -qF "$text" "$file"; then
              echo "::error::Missing '$text' in $file"
              exit 1
            fi
          done
        
      - name: Run frontend E2E directly
        run: npm --workspace frontend run test:e2e -- --reporter=list

      - name: Verify production bundle
        run: |
          npm run build
          npm run check:prod-bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
