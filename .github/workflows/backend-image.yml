name: Build and Push Backend Image
on:
  workflow_call:
    outputs:
      previous_digest:
        description: "The previous image digest"
        value: ${{ jobs.build.outputs.previous_digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      previous_digest: ${{ steps.prev.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Get previous image digest
        id: prev
        run: |
          # Use crane to fetch the digest of latest
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v0.19.1/go-containerregistry_Linux_x86_64.tar.gz" | tar -zxvf - crane
          ./crane auth login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          DIGEST=$(./crane digest ghcr.io/${{ github.repository }}/pc-api:latest || echo "none")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pc-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pc-api-python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
