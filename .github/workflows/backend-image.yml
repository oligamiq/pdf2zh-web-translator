name: Build and Push Backend Image
on:
  workflow_call:
    outputs:
      image_digest:
        description: "The pushed image digest"
        value: ${{ jobs.build.outputs.image_digest }}
      image_ref:
        description: "The pushed image reference"
        value: ghcr.io/${{ github.repository }}/pc-api
      git_sha:
        description: "The github sha"
        value: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./pc-api-python
          push: true
          platforms: linux/amd64,linux/arm64
          # We don't use meta action tags here, just the immutable digest.
          # To keep it identifiable, we can push a git sha tag.
          tags: ghcr.io/${{ github.repository }}/pc-api:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
