name: Main Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  issues: write
  actions: read

concurrency:
  group: production-main-pipeline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check Python syntax
        run: python3 -m compileall pc-api-python

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Build Worker
        working-directory: worker
        run: npm run build

      - name: Create dummy Compose environment
        run: |
          cat <<'EOF' > .env
          CLOUDFLARE_TUNNEL_TOKEN=dummy
          WORKER_API_BASE_URL=http://dummy
          HDD_BASE=/dummy
          PROXY_SECRET=dummy
          AGENT_TOKEN=dummy
          PDF2ZH_DEFAULT_BASE_URL=http://dummy
          PDF2ZH_DEFAULT_MODEL=dummy
          PDF2ZH_DEFAULT_API_KEY=dummy
          EOF

      - name: Validate base Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Generate autodeploy effective configuration
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.autodeploy.yml \
            config \
            --format json \
            > /tmp/pdftr-compose-effective.json

      - name: Validate autodeploy configuration
        run: |
          set -euo pipefail

          build_value="$(
            jq -r \
              '.services["pc-api"].build // empty' \
              /tmp/pdftr-compose-effective.json
          )"

          if [ -n "$build_value" ] &&
             [ "$build_value" != "null" ]; then
            echo "::error::build is present in the autodeploy pc-api configuration"
            exit 1
          fi

          image_value="$(
            jq -r \
              '.services["pc-api"].image' \
              /tmp/pdftr-compose-effective.json
          )"

          if [ "$image_value" != \
            "ghcr.io/oligamiq/pdf2zh-web-translator/pc-api:production" ]; then
            echo "::error::Unexpected pc-api image: $image_value"
            exit 1
          fi

          label_value="$(
            jq -r \
              '.services["pc-api"].labels["com.centurylinklabs.watchtower.enable"]' \
              /tmp/pdftr-compose-effective.json
          )"

          if [ "$label_value" != "true" ]; then
            echo "::error::Watchtower label is missing"
            exit 1
          fi

      - name: Install actionlint
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" |
            tar -xz actionlint

      - name: Run actionlint
        run: ./actionlint

      - name: Lint shell scripts
        run: shellcheck scripts/install-prod-autodeploy.sh

      - name: Test Backend container startup
        run: |
          set -euo pipefail

          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t pc-api-ci \
            ./pc-api-python

          docker run \
            -d \
            --name pc-api-ci \
            -e PC_AGENT_AUTOSTART=false \
            pc-api-ci

          for _ in $(seq 1 30); do
            if docker exec pc-api-ci python -c '
          import json
          import urllib.request

          data = json.load(
              urllib.request.urlopen(
                  "http://127.0.0.1:8081/internal/healthz",
                  timeout=3,
              )
          )

          assert data["status"] == "ok"
          assert data["git_sha"] != "unknown"
          '; then
              exit 0
            fi

            sleep 2
          done

          docker logs pc-api-ci
          exit 1

      - name: Cleanup Backend test container
        if: always()
        run: docker rm -f pc-api-ci || true

  deploy-worker:
    needs: test
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit

  backend-image:
    needs: test
    uses: ./.github/workflows/backend-image.yml
    secrets: inherit

  deploy-backend:
    needs:
      - deploy-worker
      - backend-image
    uses: ./.github/workflows/deploy-backend.yml
    with:
      image_ref: ${{ needs.backend-image.outputs.image_ref }}
      image_digest: ${{ needs.backend-image.outputs.image_digest }}
      git_sha: ${{ needs.backend-image.outputs.git_sha }}
    secrets: inherit

  smoke:
    needs: deploy-backend
    uses: ./.github/workflows/prod-smoke.yml
    secrets: inherit

  deploy-frontend:
    needs: smoke
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit

  finalize:
    needs:
      - deploy-frontend
      - backend-image
    runs-on: ubuntu-latest

    steps:
      - name: Install crane
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/google/go-containerregistry/releases/download/v0.19.1/go-containerregistry_Linux_x86_64.tar.gz" |
            tar -xz crane

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ./crane auth login \
            ghcr.io \
            -u "${{ github.actor }}" \
            -p "$GHCR_TOKEN"

      - name: Tag verified image as stable
        run: |
          set -euo pipefail

          ./crane tag \
            "${{ needs.backend-image.outputs.image_ref }}@${{ needs.backend-image.outputs.image_digest }}" \
            stable

  rollback:
    if: >-
      ${{
        always() &&
        needs.backend-image.result == 'success' &&
        (
          needs.deploy-backend.result == 'failure' ||
          needs.deploy-backend.result == 'cancelled' ||
          needs.smoke.result == 'failure' ||
          needs.smoke.result == 'cancelled' ||
          needs.deploy-frontend.result == 'failure' ||
          needs.deploy-frontend.result == 'cancelled'
        )
      }}

    needs:
      - deploy-backend
      - smoke
      - deploy-frontend
      - backend-image

    runs-on: ubuntu-latest

    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check whether this is the latest main commit
        id: latest
        run: |
          set -euo pipefail

          latest_sha="$(
            git ls-remote \
              "https://github.com/${{ github.repository }}.git" \
              refs/heads/main |
              cut -f1
          )"

          if [ "$latest_sha" = "${{ github.sha }}" ]; then
            echo "should_rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "This run has been superseded by a newer main commit."
            echo "should_rollback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install crane
        if: steps.latest.outputs.should_rollback == 'true'
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/google/go-containerregistry/releases/download/v0.19.1/go-containerregistry_Linux_x86_64.tar.gz" |
            tar -xz crane

      - name: Authenticate to GHCR
        if: steps.latest.outputs.should_rollback == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ./crane auth login \
            ghcr.io \
            -u "${{ github.actor }}" \
            -p "$GHCR_TOKEN"

      - name: Restore stable image when available
        if: steps.latest.outputs.should_rollback == 'true'
        id: restore
        continue-on-error: true
        run: |
          set -euo pipefail

          image="ghcr.io/${{ github.repository }}/pc-api"

          if stable_digest="$(
            ./crane digest "$image:stable" 2>/dev/null
          )"; then
            if ./crane tag "$image@$stable_digest" production; then
              echo "result=stable restored to production" \
                >> "$GITHUB_OUTPUT"
            else
              echo "result=stable exists but restoration failed" \
                >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "No stable tag exists yet."
            echo "result=stable unavailable; production unchanged" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update deployment failure Issue
        if: >-
          ${{
            always() &&
            steps.latest.outputs.should_rollback == 'true'
          }}
        run: |
          set -euo pipefail

          issue_title="prod-smoke failure"
          rollback_result="${{ steps.restore.outputs.result }}"

          if [ -z "$rollback_result" ]; then
            rollback_result="rollback result unavailable"
          fi

          body="$(cat <<EOF
          ## Deployment failure

          A production deployment or smoke test failed.

          - Failed Git SHA: \`${{ github.sha }}\`
          - Failed image digest: \`${{ needs.backend-image.outputs.image_digest }}\`
          - Rollback result: \`$rollback_result\`
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

          issue_number="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search "in:title \"$issue_title\"" \
              --json number,title \
              --jq \
                '.[] | select(.title == "prod-smoke failure") | .number' |
              head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue comment \
              "$issue_number" \
              --repo "$GH_REPO" \
              --body "$body"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$issue_title" \
              --body "$body"
          fi

      - name: Fail when stable restoration failed
        if: steps.restore.outcome == 'failure'
        run: |
          echo "::error::The stable image existed but could not be restored."
          exit 1
