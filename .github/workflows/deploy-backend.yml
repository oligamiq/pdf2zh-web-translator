name: Deploy Backend
on:
  workflow_call:
    inputs:
      image_ref:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      git_sha:
        required: true
        type: string

jobs:
  wait-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to production (Tag production)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v0.19.1/go-containerregistry_Linux_x86_64.tar.gz" | tar -zxvf - crane
          ./crane auth login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          # Tag the immutable digest as production
          ./crane tag ${{ inputs.image_ref }}@${{ inputs.image_digest }} production

      - name: Wait for production deployment
        id: wait
        run: |
          echo "Waiting for production /health/pc-api to report git_sha: ${{ inputs.git_sha }}..."
          WORKER_URL="https://pdftr.oligami.workers.dev"
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            HEALTH_JSON=$(curl -s "$WORKER_URL/health/pc-api" || echo "{}")
            REPORTED_SHA=$(echo "$HEALTH_JSON" | jq -r '.git_sha // "unknown"')
            STATUS=$(echo "$HEALTH_JSON" | jq -r '.status // "unknown"')
            
            if [ "$REPORTED_SHA" = "${{ inputs.git_sha }}" ] && [ "$STATUS" = "online" ]; then
              echo "✅ Production is running the expected version ($REPORTED_SHA) and is online."
              exit 0
            fi
            
            echo "Currently running: $REPORTED_SHA, status: $STATUS. Retrying in 10s... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          echo "❌ Timed out waiting for deployment or healthcheck failed."
          echo "HEALTH_JSON=$HEALTH_JSON" >> "$GITHUB_ENV"
          exit 1
