name: Deploy Backend

on:
  workflow_call:
    inputs:
      image_ref:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      git_sha:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  wait-for-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install crane
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/google/go-containerregistry/releases/download/v0.19.1/go-containerregistry_Linux_x86_64.tar.gz" |
            tar -xz crane

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ./crane auth login \
            ghcr.io \
            -u "${{ github.actor }}" \
            -p "$GHCR_TOKEN"

      - name: Tag candidate as production
        run: |
          set -euo pipefail

          ./crane tag \
            "${{ inputs.image_ref }}@${{ inputs.image_digest }}" \
            production

      - name: Wait for production deployment
        run: |
          set -euo pipefail

          worker_url="https://pdftr.oligami.workers.dev"
          expected_sha="${{ inputs.git_sha }}"
          max_retries=60

          echo "Waiting for production Backend SHA: $expected_sha"

          for retry_count in $(seq 1 "$max_retries"); do
            health_json="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "$worker_url/health/pc-api" \
                2>/dev/null ||
                printf '{}'
            )"

            reported_sha="$(
              printf '%s' "$health_json" |
                jq -r '.git_sha // "unknown"' 2>/dev/null ||
                printf 'unknown'
            )"

            status="$(
              printf '%s' "$health_json" |
                jq -r '.status // "unknown"' 2>/dev/null ||
                printf 'unknown'
            )"

            printf \
              'Attempt %s/%s: git_sha=%s status=%s\n' \
              "$retry_count" \
              "$max_retries" \
              "$reported_sha" \
              "$status"

            if [ "$reported_sha" = "$expected_sha" ] &&
               { [ "$status" = "online" ] || [ "$status" = "ok" ]; }; then
              echo "Production Backend is running the expected SHA."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for the expected production Backend SHA."
          exit 1
