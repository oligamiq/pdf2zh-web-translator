name: Production Smoke Test

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke-siliconflow:
    name: SiliconFlow Connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check smoke token
        env:
          PROD_SMOKE_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
        run: |
          if [ -z "$PROD_SMOKE_TOKEN" ]; then
            echo "::error::PROD_SMOKE_TOKEN is missing"
            exit 1
          fi

      - name: Run SiliconFlow smoke test
        id: smoke
        env:
          PROD_SMOKE_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
          PROD_WORKER_URL: https://pdftr.oligami.workers.dev
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          set +e

          env -u GITHUB_STEP_SUMMARY \
            npm run smoke:prod-siliconflow \
            > /tmp/prod-smoke.raw.log \
            2>&1

          smoke_status=$?
          set -e

          failure_code="$(
            grep -Eo \
              '\[(missing_smoke_token|backend_health_failed|d1_timeout|smoke_job_create_failed|job_timeout|pdf_parse_no_paragraphs|babeldoc_parse_failed|pdf2zh_siliconflowfree_failed|job_failed|route_assert_failed|pdf_download_failed|unknown)\]' \
              /tmp/prod-smoke.raw.log |
              tail -n 1 |
              tr -d '[]' ||
              true
          )"

          if [ "$smoke_status" -eq 0 ]; then
            result="passed"
          else
            result="failed"
          fi

          {
            echo "Production smoke result: $result"
            echo "Git SHA: $EXPECTED_GIT_SHA"

            if [ -n "$failure_code" ]; then
              echo "Failure code: $failure_code"
            fi

            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > prod-smoke.sanitized.log

          cat prod-smoke.sanitized.log

          {
            echo "## Production Smoke Test"
            echo
            cat prod-smoke.sanitized.log
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f \
            /tmp/prod-smoke.raw.log \
            smoke-summary.md

          exit "$smoke_status"

      - name: Upload sanitized smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-log
          path: prod-smoke.sanitized.log
          retention-days: 7
          if-no-files-found: error

      - name: Create or update failure Issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          issue_title="prod-smoke failure"

          if [ -f prod-smoke.sanitized.log ]; then
            body="$(cat prod-smoke.sanitized.log)"
          else
            body="Production smoke failed. No sanitized result was generated."
          fi

          issue_number="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search "in:title \"$issue_title\"" \
              --json number,title \
              --jq \
                '.[] | select(.title == "prod-smoke failure") | .number' |
              head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue comment \
              "$issue_number" \
              --repo "$GH_REPO" \
              --body "$body"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$issue_title" \
              --body "$body"
          fi

      - name: Close failure Issue after success
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          issue_number="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search 'in:title "prod-smoke failure"' \
              --json number,title \
              --jq \
                '.[] | select(.title == "prod-smoke failure") | .number' |
              head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue close \
              "$issue_number" \
              --repo "$GH_REPO" \
              --reason completed \
              --comment \
                "Production smoke passed for commit ${{ github.sha }}."
          fi
