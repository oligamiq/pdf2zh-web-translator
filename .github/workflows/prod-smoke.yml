name: Production Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prod-smoke.yml'
      - 'scripts/prod-smoke-siliconflow.mjs'
      - 'scripts/fixtures/**'
      - 'pc-api-python/**'

permissions:
  contents: read
  packages: write
  actions: read
  issues: write

jobs:
  build-and-push:
    name: Build & Push pc-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python Syntax Check
        run: python3 -m compileall pc-api-python

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pc-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pc-api-python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}

  smoke-siliconflow:
    name: SiliconFlow Connectivity
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Secret
        run: |
          if [ -z "${{ secrets.PROD_SMOKE_TOKEN }}" ]; then
            echo "## ❌ Error: PROD_SMOKE_TOKEN is missing" >> $GITHUB_STEP_SUMMARY
            echo "missing_smoke_token" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Wait for production deployment
        run: |
          echo "Waiting for production /health/pc-api to report git_sha: ${{ github.sha }}..."
          WORKER_URL="https://pdftr.oligami.workers.dev"
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HEALTH_JSON=$(curl -s "$WORKER_URL/health/pc-api" || echo "{}")
            REPORTED_SHA=$(echo "$HEALTH_JSON" | jq -r '.git_sha // "unknown"')
            
            if [ "$REPORTED_SHA" = "${{ github.sha }}" ]; then
              echo "✅ Production is running the expected version ($REPORTED_SHA)."
              exit 0
            fi
            
            echo "Currently running: $REPORTED_SHA. Retrying in 10s... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          echo "❌ Timed out waiting for deployment."
          exit 1

      - name: Run SiliconFlow smoke test
        id: smoke
        run: |
          set -o pipefail
          npm run smoke:prod-siliconflow 2>&1 | tee prod-smoke.log
        env:
          PROD_SMOKE_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
          PROD_WORKER_URL: https://pdftr.oligami.workers.dev

      - name: Upload Smoke Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-smoke-log
          path: prod-smoke.log
          retention-days: 7

      - name: Handle Failure (Create/Update Issue)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="prod-smoke failure"
          BODY="Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f "smoke-summary.md" ]; then
            BODY="$(cat smoke-summary.md)

          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          
          ISSUE_NUMBER=$(gh issue list --search "in:title \"$ISSUE_TITLE\" state:open" --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          fi

      - name: Handle Success (Close Issue)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="prod-smoke failure"
          ISSUE_NUMBER=$(gh issue list --search "in:title \"$ISSUE_TITLE\" state:open" --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Smoke test succeeded! 🎉
          
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
