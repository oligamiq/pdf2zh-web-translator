name: Production Smoke Test

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  smoke-siliconflow:
    name: SiliconFlow Connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Secret
        run: |
          if [ -z "${{ secrets.PROD_SMOKE_TOKEN }}" ]; then
            echo "## ❌ Error: PROD_SMOKE_TOKEN is missing" >> $GITHUB_STEP_SUMMARY
            echo "missing_smoke_token" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run SiliconFlow smoke test
        id: smoke
        run: |
          set -o pipefail
          npm run smoke:prod-siliconflow 2>&1 | tee prod-smoke.log
        env:
          PROD_SMOKE_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
          PROD_WORKER_URL: https://pdftr.oligami.workers.dev
          EXPECTED_GIT_SHA: ${{ github.sha }}

      - name: Sanitize Smoke Log
        if: always()
        run: |
          if [ -f prod-smoke.log ]; then
            sed -E -e 's/receipt=[^&\s"'"'"']+/receipt=***MASKED***/g' \
                   -e 's/view_token=[^&\s"'"'"']+/view_token=***MASKED***/g' \
                   -e 's/X-Smoke-Token: [^\s"'"'"']+/X-Smoke-Token: ***MASKED***/gi' \
                   -e 's/Authorization: Bearer [^\s"'"'"']+/Authorization: Bearer ***MASKED***/gi' \
                   -e 's/sk-[a-zA-Z0-9_]+/sk-***MASKED***/g' \
                   prod-smoke.log > prod-smoke.sanitized.log
            rm prod-smoke.log
          fi

      - name: Upload Smoke Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-smoke-log
          path: prod-smoke.sanitized.log
          retention-days: 7

      - name: Handle Failure (Create/Update Issue)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="prod-smoke failure"
          BODY="Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f "smoke-summary.md" ]; then
            BODY="$(cat smoke-summary.md)
            
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          
          ISSUE_NUMBER=$(gh issue list --search "in:title \"$ISSUE_TITLE\" state:open" --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          fi

      - name: Handle Success (Close Issue)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="prod-smoke failure"
          ISSUE_NUMBER=$(gh issue list --search "in:title \"$ISSUE_TITLE\" state:open" --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Smoke test succeeded! 🎉
          
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
